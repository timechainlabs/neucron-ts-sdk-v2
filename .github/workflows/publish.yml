name: Publish to NPM
on:
    release:
        types: [created]

permissions:
    contents: read
    id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
    publish:
        runs-on: ubuntu-latest # trusted publishing requires a cloud-hosted runner
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'
                  # Dependency caching is deliberately not enabled here: release
                  # builds should always resolve from the lockfile.
            # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles
            # npm 10.x, which silently falls back to token auth and fails.
            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@latest
                  npm -v
            - name: Install dependencies
              run: npm ci
            - name: Typecheck
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Unit tests
              run: npm run test:unit
            # Build before publishing so a broken build fails here rather than
            # halfway through `npm publish`'s prepublishOnly hook.
            - name: Build
              run: npm run build
            - name: Verify release tag matches package version
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TAG="${GITHUB_REF_NAME#v}"
                  if [ "$PKG_VERSION" != "$TAG" ]; then
                    echo "::error::package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)"
                    exit 1
                  fi
            # Authentication comes from the OIDC token, so no NODE_AUTH_TOKEN is
            # set here. Provenance is generated automatically under trusted
            # publishing, so --provenance is not passed either.
            - name: Publish package on NPM
              run: npm publish --access public
