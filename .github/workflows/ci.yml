name: CI (Lint & Test)

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Lint check
      - name: Run ESLint
        run: npm run lint

      # Type check
      - name: Run TypeScript typecheck
        run: npm run typecheck

      # Run unit tests
      - name: Run unit tests
        run: npm run test:unit -- --coverage
      # Run integration tests
      - name: Run integration tests
        run: npm run test:integration -- --coverage
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_TEAM_ID: ${{ secrets.TEST_TEAM_ID }}
          TEST_INVITE_EMAIL: ${{ secrets.TEST_INVITE_EMAIL }}
          TEST_PAY_WALLET_ID: ${{ secrets.TEST_PAY_WALLET_ID }}
          TEST_PAY_AMOUNT: ${{ secrets.TEST_PAY_AMOUNT }}
          TEST_PAY_WITH_ADDRESS: ${{ secrets.TEST_PAY_WITH_ADDRESS }}
          TEST_PAY_WITH_EMAIL: ${{ secrets.TEST_PAY_WITH_EMAIL }}
          TEST_PAY_WITH_PAYMAIL: ${{ secrets.TEST_PAY_WITH_PAYMAIL }}

      # (Optional) Upload coverage report as artifact
      - name: Upload coverage report
        if: always() # even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
