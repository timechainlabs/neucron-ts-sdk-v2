name: CI (Lint & Test)

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            # Checkout repo
            - name: Checkout repository
              uses: actions/checkout@v7

            # Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            # Install dependencies
            # Uses the same npm major as the publish workflow so that lockfile
            # strictness regressions surface here rather than at release time.
            - name: Upgrade npm
              run: |
                  npm install -g npm@latest
                  npm -v
            - name: Install dependencies
              run: npm ci

            # Lint check
            - name: Run ESLint
              run: npm run lint

            # Type check
            - name: Run TypeScript typecheck
              run: npm run typecheck

            # Run unit tests
            - name: Run unit tests
              run: npm run test:unit -- --coverage

            # Build the distributable. This runs on every push because the
            # publish workflow builds via `prepublishOnly`, so a build that only
            # works on a maintainer's machine would otherwise fail at release
            # time. It also catches missing platform-specific native bindings in
            # package-lock.json (see scripts/patch-lockfile-bindings.mjs).
            - name: Build
              run: npm run build
            # Run integration tests against the live API. Non-blocking: these have
            # failed since mid-July because the TEST_USER_EMAIL account returns
            # "record not found" (test account missing on the API, not a code bug).
            # Once the secrets point at a valid account again, remove
            # continue-on-error so regressions block merges.
            - name: Run integration tests
              continue-on-error: true
              run: npm run test:integration -- --coverage
              env:
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
                  TEST_BUSINESS_ID: ${{ secrets.TEST_BUSINESS_ID }}
                  TEST_INVITE_EMAIL: ${{ secrets.TEST_INVITE_EMAIL }}
                  TEST_PAY_WALLET_ID: ${{ secrets.TEST_PAY_WALLET_ID }}
                  TEST_PAY_AMOUNT: ${{ secrets.TEST_PAY_AMOUNT }}
                  TEST_PAY_WITH_ADDRESS: ${{ secrets.TEST_PAY_WITH_ADDRESS }}
                  TEST_PAY_WITH_EMAIL: ${{ secrets.TEST_PAY_WITH_EMAIL }}
                  TEST_PAY_WITH_PAYMAIL: ${{ secrets.TEST_PAY_WITH_PAYMAIL }}

            # (Optional) Upload coverage report as artifact
            - name: Upload coverage report
              if: always() # even if tests fail
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/
